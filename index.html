<!DOCTYPE html>
<HTML>

<HEAD>
  <title>Vimophone</title>
  <meta charset="utf-8">
  <script type="module" defer src="./components/synth-init.js"></script>
  <script type="module" defer src="./components/synth-note.js"></script>
  <script type="module" defer src="./components/synth-modifier.js"></script>
  <script type="module" defer src="./components/alpha-keyboard.js"></script>
</HEAD>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    display: flex;
    padding-top: 30vh;
    justify-content: center;
  }

  alpha-keyboard [key] {
    text-align: center;
    align-content: center;
  }

  alpha-keyboard [mod="flat"],
  alpha-keyboard [mod="sharp"] {
    font-size: 1.5rem;
  }

  alpha-keyboard [key]:hover {
    background-color: #f0f0f0;
  }
</style>

<BODY>
  <synth-init>
    <alpha-keyboard>
      <synth-note note="c" key="KeyC" slot="c">C</synth-note>
      <synth-note note="d" key="KeyD" slot="d">D</synth-note>
      <synth-note note="e" key="KeyE" slot="e">E</synth-note>
      <synth-note note="f" key="KeyF" slot="f">F</synth-note>
      <synth-note note="g" key="KeyG" slot="g">G</synth-note>
      <synth-note note="a" key="KeyA" slot="a">A</synth-note>
      <synth-note note="b" key="KeyB" slot="b">B</synth-note>
      <synth-modifier mod="oct-2" key="Comma" slot=",">-2</synth-modifier>
      <synth-modifier mod="oct-1" key="KeyK" slot="k">-1</synth-modifier>
      <synth-modifier mod="oct+1" key="KeyI" slot="i">+1</synth-modifier>
      <synth-modifier mod="flat" key="KeyJ" slot="j">♭</synth-modifier>
      <synth-modifier mod="sharp" key="KeyU" slot="u">♯</synth-modifier>
    </alpha-keyboard>
  </synth-init>
</BODY>

</HTML>
